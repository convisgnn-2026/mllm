models: [flux]
schedule_logics: [dyn_slo_schedule_global, dyn_slo_schedule_global_dp, per_resolution_schedule]
gpu_nums: [4]
distributions: [gamma]
rates: [0.2]
cvs: [1.0]
steps: [20]
shape_dists: [evenly]
output_types: [latent]
request_nums: [20]
output_dir: tetriserve_benchmark/serving_benchmark/results/2025_11_24_Test/dyn_sp_vs_tetris
seed: 42
save_interval: 1
save_logs: true  # Save console output to log file
no_timestamp: true  # Use fixed filename without timestamp
resume: false  # Set to true to resume from existing results

fake_engine: true
enable_tracer: true

# Runtime configuration
use_cuda_graph: false  # Disable CUDA graph
use_torch_compile: false  # Disable torch compile

# SLO configuration - Custom SLO mapping example
slo_configs: [custom_1_1.0x_slo]
