models: [flux]
schedule_logics: [data_parallel, fixed_sp_2, fixed_sp_4, fixed_sp_8, per_resolution_schedule]
gpu_nums: [8]
distributions: [gamma]
rates: [0.2]
cvs: [1.0]
steps: [20]
shape_dists: [evenly, long_seqlen_high]
output_types: [latent]
request_nums: [300]
output_dir: results/benchmark_flux_H100_baseline
seed: 42
save_interval: 1
save_logs: true  # Save console output to log file
no_timestamp: true  # Use fixed filename without timestamp
resume: True  # Set to true to resume from existing results

fake_engine: false
enable_tracer: true
enable_warmup: false  # Disable warmup for baseline measurements

# Runtime configuration
use_cuda_graph: false  # Disable CUDA graph
use_torch_compile: false  # Disable torch compile

# SLO configuration - Custom SLO mapping example
slo_configs: [custom_1_1.0x_slo_H100_flux]
