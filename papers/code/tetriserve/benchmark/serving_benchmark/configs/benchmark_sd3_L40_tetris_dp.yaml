# uv run python -m benchmark.serving_benchmark.benchmark_serving --config benchmark/serving_benchmark/configs/benchmark_sd3_L40_tetris_dp.yaml --output-dir ./tetriserve_benchmark/serving_benchmark/results/benchmark_sd3_L40_tetris_dp
