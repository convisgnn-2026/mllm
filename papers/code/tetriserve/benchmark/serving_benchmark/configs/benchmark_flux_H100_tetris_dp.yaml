models: [flux]
schedule_logics: [dyn_slo_schedule_global_dp]
gpu_nums: [8]
distributions: [gamma]
# rates: [0.15, 0.2, 0.25, 0.3]
rates: [0.2]
cvs: [1.0]
steps: [20]
shape_dists: [evenly, long_seqlen_high]
output_types: [latent]
request_nums: [300]
output_dir: results/benchmark_flux_H100_tetris_dp
seed: 42
save_interval: 1
save_logs: true  # Save console output to log file
no_timestamp: true  # Use fixed filename without timestamp
resume: True  # Set to true to resume from existing results

fake_engine: false
skip_latent_transfer: true  # Set to false to enable real NCCL P2P transfers
enable_tracer: true

# Runtime configuration
use_cuda_graph: false  # Disable CUDA graph
use_torch_compile: false  # Disable torch compile

# SLO configuration - Custom SLO mapping example
slo_configs: [custom_1_1.0x_slo_H100_flux, custom_1_1.1x_slo_H100_flux, custom_1_1.2x_slo_H100_flux, custom_1_1.3x_slo_H100_flux, custom_1_1.4x_slo_H100_flux, custom_1_1.5x_slo_H100_flux]
